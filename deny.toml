# cargo-deny configuration.
#
# Runs in CI on every PR + nightly at 04:00 UTC. The crate's
# dependency surface is small and entirely on crates.io, so this
# template is intentionally strict: no unknown registries, no
# git deps, no duplicate versions, no wildcard requirements.
#
# When a violation surfaces, prefer the upstream fix:
#   - multiple-versions  -> bump the dep pulling in the older
#                           one, or add a [patch.crates-io] until
#                           upstream catches up; only [bans.skip]
#                           with a rationale if upstream-blocked.
#   - advisory           -> upgrade the affected crate; only add
#                           to [advisories.ignore] with the
#                           RUSTSEC id and a written-out reason.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # paste 1.0.x is unmaintained but still depended on by ark-ff's
    # proc-macro layer (ark-ff-macros). No safe upgrade exists in
    # the 0.5.x ark-* line we're pinned against, and ark-* hasn't
    # cut a release that drops paste. Mirrors the same ignore in
    # pso-poseidon, pso-vdf, and pso-zk-circuits. Revisit when
    # ark-* moves off paste.
    "RUSTSEC-2024-0436",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    # `Unicode-3.0` is the current license of `unicode-ident` (pulled
    # in transitively via every proc-macro crate). `Unicode-DFS-2016`
    # is the predecessor; we keep both to span old + new releases of
    # any transitive ark-* / proc-macro crate.
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Allow a version-less (`*`) requirement when the dependency is a local path
# dep — the companion `pso-protocol-derive` is pulled by path as a dev-dep for
# the entity-hash tests. A literal version would mismatch the path crate after
# cocogitto's next bump (the pre-bump hook only rewrites the column-0 version),
# so the path requirement is intentional. Registry wildcards stay banned.
allow-wildcard-paths = true
deny = []
# Unavoidable, upstream-blocked crypto-stack version splits: arkworks 0.6
# pulls the `digest 0.10` family (block-buffer 0.10, crypto-common 0.1,
# cpufeatures, generic-array 0.14); `sha3 0.11` (and the optional `alloy`
# feature) pull the `digest 0.11` family (block-buffer 0.12, crypto-common
# 0.2); and the codec depends on `generic-array 1.x` directly for type-level
# key sizing. None can be unified without dropping arkworks, sha3/alloy, or
# the typed-length codec.
#
# `syn` is the same shape but build-time only. `thiserror-impl` and
# `enum-ordinalize-derive` moved to syn 3; the arkworks proc macros
# (`ark-ff-asm`, `ark-ff-macros`, `ark-serialize-derive`, `educe`) and this
# repo's own `pso-protocol-derive` are still on syn 2. Proc-macro crates are
# compiled for the host and linked into the compiler, not into the artifact,
# so the duplicate costs build time and nothing else. It unifies when arkworks
# moves; drop this entry then.
#
# Note this repo does not commit `Cargo.lock`, so CI resolves fresh on every
# run and the nightly cron sees upstream drift the day it lands. That is the
# point of the cron, but it means entries here appear without a local change —
# this one did, and `main` had been red since mid-August because of it.
skip = [
    { crate = "generic-array", reason = "codec uses 1.x; ark's digest-0.10 stack pulls 0.14" },
    { crate = "digest", reason = "arkworks -> 0.10, sha3/alloy -> 0.11" },
    { crate = "block-buffer", reason = "transitive: digest 0.10 vs 0.11" },
    { crate = "crypto-common", reason = "transitive: digest 0.10 vs 0.11" },
    { crate = "cpufeatures", reason = "transitive across the two digest stacks" },
    { crate = "syn", reason = "thiserror-impl/enum-ordinalize on syn 3; arkworks' proc macros still on syn 2" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
